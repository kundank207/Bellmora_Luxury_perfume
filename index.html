<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23C6A46A'>◆</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BELLMORA LUXURY | The Art of Fragrance</title>
    <meta name="description" content="BELLMORA LUXURY — Premium luxury perfume house crafting original haute parfumerie and artisanal interpretations. A Fragrance That Defines You." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global Diagnostic Guard -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('Captured window error:', e);
        var existing = document.getElementById('aura-runtime-error');
        if (!existing) {
          var div = document.createElement('div');
          div.id = 'aura-runtime-error';
          div.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:#fff1f0;border:2px solid #ff4d4f;color:#cf1322;padding:16px;z-index:999999;font-family:sans-serif;border-radius:12px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,0.15);';
          div.innerHTML = '<strong style="font-size:14px;">Runtime Error Detected:</strong><br/>' + (e.message || 'Unknown script error') + '<br/><span style="color:#666;font-size:10px;">' + (e.filename || '') + ':' + (e.lineno || '') + '</span>';
          document.body.appendChild(div);
        }
      });
    </script>
  </head>
  <body class="bg-aura-ivory text-aura-espresso font-sans selection:bg-aura-gold/20 selection:text-aura-espresso antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
